<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>AI Novel Factory - 啟動中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #1e1e2f 0%, #2d2b55 100%);
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    user-select: none;
  }
  h1 { font-size: 22px; font-weight: 700; }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: #818cf8;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 14px; color: #cbd5e1; min-height: 20px; }
  .hint { font-size: 12px; color: #64748b; }
</style>
</head>
<body>
  <h1>🌌 AI Novel Factory</h1>
  <div class="spinner"></div>
  <div id="status">正在啟動…</div>
  <div class="hint">首次啟動需解壓後端元件，請稍候約 10～30 秒</div>
  <script>
    if (window.electron && window.electron.onStatus) {
      window.electron.onStatus((msg) => {
        document.getElementById('status').textContent = msg;
      });
    }
  </script>
</body>
</html>

name: Build & Release Packages

# 架構對應（SSOT）：
# - 前端：React 18 + Vite + TS，`frontend/vite.config.ts (base: './')`，產物 `frontend/dist/`（有版控）。
# - 後端：`backend/app.py get_static_dir()` 掛載 `frontend/dist`；GitHub Pages 版則由
#   `frontend/src/platform/index.ts` 在 github.io 下指向雲端後端（VITE_CLOUD_API_URL / 內建 fallback）。
# - 本地打包 SSOT 是 `build_app.py`：web dist -> PyInstaller sidecar（含 dist）-> electron-builder；
#   APK 用已版控的 `frontend/android/app/mykey.keystore (mykey/123456)` 簽名（見 android/app/build.gradle）。
# - 版本 SSOT 是根目錄 `version.json`（前端 version.ts / electron 由 build_app.py 同步）。

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub Pages 靜態前端在 github.io 上運行時的雲端後端位址。
  # 未設定 Repository Variable 時，platform/index.ts 內建 fallback 生效，不會破壞建置。
  VITE_CLOUD_API_URL: ${{ vars.VITE_CLOUD_API_URL }}

jobs:
  test-and-build-web:
    name: Run Tests & Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # *.png / *.ico / *.db 走 Git LFS（見 .gitattributes），APK/Electron 資源需要完整檔
          lfs: true

      - name: Verify Tag Matches version.json (SSOT)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SSOT_VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          echo "Tag version: ${TAG_VERSION} | version.json version: ${SSOT_VERSION}"
          if [ "${TAG_VERSION}" != "${SSOT_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} 與 version.json 的 ${SSOT_VERSION} 不一致，請先更新 version.json 再打 tag。"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Web Dist (single source for all downstream jobs)
        run: |
          cd frontend
          npm ci
          npm run build
          # 與 build_app.py::build_web_dist 相同的 SSOT 閘門：一定要有 dist/index.html
          test -f dist/index.html || (echo "::error::frontend/dist/index.html 缺失，前端建置失敗" && exit 1)

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio fastapi httpx uvicorn

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/

      - name: Deploy React App to GitHub Pages (gh-pages)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true

  build-android-apk:
    name: Build Signed Android APK
    needs: test-and-build-web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Web Dist (single source, do not rebuild)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - name: Sync Capacitor (needs node_modules for `npx cap`, no rebuild)
        run: |
          cd frontend
          npm ci
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html || (echo "::error::Capacitor 同步後缺失 assets/public/index.html" && exit 1)

      - name: Make Gradlew Executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Release APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleRelease --no-daemon
        # 簽名設定：android/app/build.gradle signingConfigs.release 指向已版控的
        # mykey.keystore (mykey/123456)，與 build_app.py::ensure_keystore 同一組 SSOT，
        # 因此這裡不需要額外 keystore 步驟，產物即為簽名版。

      - name: Collect and Rename APK (name matches build_app.py SSOT)
        run: |
          mkdir -p dist-packages
          test -f frontend/android/app/build/outputs/apk/release/app-release.apk || (echo "::error::找不到 app-release.apk" && exit 1)
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist-packages/AI_Novel_Factory_signed.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Novel_Factory_signed_apk
          path: dist-packages/AI_Novel_Factory_signed.apk
          if-no-files-found: error

  build-windows-electron:
    name: Build Electron Portable (Windows)
    needs: test-and-build-web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          # 注意：需求是 requirements.txt 的 opencc-python-reimplemented（純 Python），
          # 不要裝 `opencc`（C 擴充，在 Windows runner 上編譯易失敗）。
          pip install pyinstaller pillow

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - name: Install Frontend Dependencies (required by build_app.py rebuild)
        # 關鍵修正：build_app.py 內部一定會重跑 `npm run build`（build_web_dist），
        # 之前此 job 缺少 frontend `npm ci`，在乾淨 runner 上必定失敗。
        run: |
          cd frontend
          npm ci

      - name: Build Electron Portable (Frontend + Backend Sidecar + Shell)
        # 版本號由 build_app.py::sync_electron_version 自 version.json (SSOT) 同步，
        # 產物命名 AI_Novel_Factory_<version>_Electron_Portable.exe
        run: |
          python build_app.py --target electron

      - name: Upload Electron Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Novel_Factory_Electron_Portable
          path: dist-packages/AI_Novel_Factory_*_Electron_Portable.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (tags only)
    needs: [build-android-apk, build-windows-electron]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

name: Build & Release Packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-web:
    name: Run Tests & Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Tag Matches version.json (SSOT)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SSOT_VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          echo "Tag version: ${TAG_VERSION} | version.json version: ${SSOT_VERSION}"
          if [ "${TAG_VERSION}" != "${SSOT_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} 與 version.json 的 ${SSOT_VERSION} 不一致，請先更新 version.json 再打 tag。"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Web Dist
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio fastapi httpx uvicorn

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/

      - name: Deploy React App to GitHub Pages (gh-pages)
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          force_orphan: true

  build-android-apk:
    name: Build Signed Android APK
    needs: test-and-build-web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Frontend & Sync Capacitor
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Release APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleRelease --no-daemon

      - name: Collect and Rename APK
        run: |
          mkdir -p dist-packages
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist-packages/AI_Novel_Factory_signed.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Novel_Factory_signed_apk
          path: dist-packages/AI_Novel_Factory_signed.apk
          if-no-files-found: error

  build-windows-electron:
    name: Build Electron Portable (Windows)
    needs: test-and-build-web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller uvicorn fastapi opencc pydantic pillow

      - name: Build Electron Portable (Frontend + Backend Sidecar + Shell)
        run: |
          python build_app.py --target electron

      - name: Upload Electron Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Novel_Factory_Electron_Portable
          path: dist-packages/AI_Novel_Factory_*_Electron_Portable.exe
          if-no-files-found: error
